# Monorepo: set Railway service Root Directory to `backend`, OR use this file at repo root.
[build]
builder = "NIXPACKS"
buildCommand = "cd backend && chmod +x build.sh && ./build.sh"

[deploy]
startCommand = "cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 120"
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
