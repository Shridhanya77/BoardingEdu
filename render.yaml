# Render Blueprint: PostgreSQL + Django API
# Dashboard: New + → Blueprint → connect this GitHub repo.
# After the first deploy, set CORS_ALLOWED_ORIGINS to your Vercel URL.

databases:
  - name: boardingedu-db
    postgresMajorVersion: "16"
    plan: basic-256mb
    databaseName: boardingedu
    user: boardingedu

services:
  - type: web
    name: boardingedu-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: chmod +x ./build.sh && ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: boardingedu-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: "^https://[a-z0-9-]+\\.vercel\\.app$"
