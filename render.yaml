# Render Blueprint: PostgreSQL + Django API.
# Dashboard: New → Blueprint → connect this GitHub repo.
# Root directory of the web service is backend/.
# The public API is https://boardingedu-backend.onrender.com

databases:
  - name: boardingedu-db
    postgresMajorVersion: "16"
    plan: basic-256mb
    databaseName: boardingedu
    user: boardingedu

services:
  - type: web
    name: boardingedu-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: chmod +x ./build.sh && ./build.sh
    startCommand: bash ./start.sh
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: boardingedu-db
          property: connectionString
      - key: OTP_BACKEND
        value: database
      - key: FRONTEND_URL
        value: https://boardingedu-bay.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://boardingedu-bay.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://boardingedu-bay.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: "^https://boardingedu(-[a-z0-9-]+)?\\.vercel\\.app$"
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET
        sync: false
      - key: CLOUDFLARE_R2_PUBLIC_BASE
        sync: false
      # ---- Email provider (pick ONE and set its keys in the Render dashboard) ----
      # Brevo (transactional email, free tier 300/day)
      - key: EMAIL_PROVIDER
        value: brevo
      - key: DEFAULT_FROM_EMAIL
        value: "BoardingEdu <no-reply@boardingedu.com>"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: BoardingEdu
      # Resend (alternative — uncomment and set EMAIL_PROVIDER=resend)
      # - key: RESEND_API_KEY
      #   sync: false
      # Cloudflare Email Service (alternative — set EMAIL_PROVIDER=cloudflare)
      # - key: CLOUDFLARE_EMAIL_API_TOKEN
      #   sync: false
      # - key: CLOUDFLARE_EMAIL_ACCOUNT_ID
      #   sync: false
      # - key: CLOUDFLARE_EMAIL_FROM
      #   value: no-reply@boardingedu.com