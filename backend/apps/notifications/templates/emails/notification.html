<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ heading }}</title>
  </head>
  <body style="margin:0;background:#f4f7fa;color:#172b3a;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 12px;background:#f4f7fa;">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff;border-radius:12px;overflow:hidden;">
          <tr><td style="padding:24px 32px;border-bottom:4px solid #e8a317;">
            <img src="{{ logo_url }}" alt="BoardingEdu" width="170" style="display:block;max-width:100%;height:auto;">
          </td></tr>
          <tr><td style="padding:32px;">
            <h1 style="margin:0 0 16px;color:#0b5f8a;font-size:24px;line-height:1.3;">{{ heading }}</h1>
            <p style="margin:0 0 24px;font-size:16px;line-height:1.6;">{{ body }}</p>
            {% if action_url %}
            <p style="margin:0 0 24px;">
              <a href="{{ action_url }}" style="display:inline-block;padding:12px 20px;border-radius:6px;background:#0b5f8a;color:#fff;text-decoration:none;font-weight:bold;">{{ action_label }}</a>
            </p>
            {% endif %}
            <p style="margin:0;color:#526575;font-size:13px;line-height:1.6;">If you did not request this, you can safely ignore this email.</p>
          </td></tr>
          <tr><td style="padding:18px 32px;background:#f4f7fa;color:#526575;font-size:12px;line-height:1.5;">
            BoardingEdu · Helping families find the right school<br>
            <a href="{{ frontend_url }}" style="color:#0b5f8a;">{{ frontend_url }}</a>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
