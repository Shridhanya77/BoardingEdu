{% extends "admin/change_form.html" %}

{% block object-tools-items %}
  {% if original and original.status == "PENDING" and can_moderate_reviews %}
    <li>
      <form method="post" action="{% url 'admin:reviews_review_approve' original.pk %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-success">Accept review</button>
      </form>
    </li>
    <li>
      <form method="post" action="{% url 'admin:reviews_review_reject' original.pk %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Reject review</button>
      </form>
    </li>
  {% endif %}
  {{ block.super }}
{% endblock %}
